[package]
name = "articulater"
version = "0.1.0"
description = "Mark now. Articulate later."
edition = "2021"

[lib]
name = "articulater_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-clipboard-manager = "2.4"
tauri-plugin-single-instance = "2.5"
notify = "8.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
dunce = "1.0"
